
name: Image Workflow

on:
  push:
    paths:
      - 'iconSet/**'
  pull_request:
    paths:
      - 'iconSet/**'
  workflow_dispatch:

jobs:
  generate_json:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Generate JSON
      run: |
        python .github/scripts/generate_image_json.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: json-artifact
        path: |
          ${{ github.workspace }}/iconSet-Color.json
          ${{ github.workspace }}/iconSet-Dark.json

    - name: Push to icon Repository
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git add iconSet/ iconSet-Color.json iconSet-Dark.json
        git commit -m "自动更新图标仓库" || exit 0
        git push origin HEAD:main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
